name: Publish Package

# Publishes to npm through OIDC trusted publishing — no npm token, no OTP, no browser.
# Requires a "Trusted Publisher" entry on npmjs.com for this repository:
#   owner better-than-coca / repository dsh-quota-dock / workflow publish.yml
# and that entry must have direct publishing ("npm publish") enabled.
#
# Releases are the default: pushing a tag ships the package *and* creates the
# GitHub release, so there is no second manual step after a version bump.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write    # required for OIDC
  contents: write    # required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never cache in release builds

      # No install step on purpose: the plugin has no runtime dependencies
      # (host packages are injected by DSH) and the repository carries no lockfile.
      - name: Show toolchain
        run: node -v && npm -v

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json"

      - run: npm test

      - run: npm publish

      # The release goes out after the package lands, so a failed publish never
      # leaves a release pointing at a version nobody can install. Note bodies
      # come from the commit log; edit the release afterwards if it needs prose.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          extra="--latest"
          case "$version" in
            *-*) extra="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-quota-dock $version" \
            --generate-notes \
            "$extra" \
            --verify-tag
